# Mirrors the plugin's configuration in the TRMNL editor so the settings live
# in version control next to the markup they drive. TRMNL remains the source of
# truth; this file is kept in step by hand.
#
# The custom field keynames below are the ones full.liquid actually reads. If a
# field is renamed in the editor without being renamed here and in the markup,
# the Liquid default kicks in silently rather than erroring.
---
name: ISS Tracker Map
description: >-
  Your TRMNL now tracks the International Space Station in (almost) real-time,
  plotting its precise location on a beautiful world map.
version: 1.2.0

strategy: polling
polling_url: https://iss-events.5g5wqr7kzx-466.workers.dev

# Fields consumed by full.liquid, with the defaults it falls back to.
custom_fields:
  - keyname: units                 # 'Metric' | 'Imperial'
    default: Metric
  - keyname: time_format           # 'Auto' | '12h' | '24h'
    default: Auto
  - keyname: show_timestamp        # 'Yes' | 'false'
    default: "Yes"
  - keyname: random_rotation       # 'true' | 'false'
    default: "true"
  - keyname: show_iss_events       # 'true' | 'false'
    default: "true"
